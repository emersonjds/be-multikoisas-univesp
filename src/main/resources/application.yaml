spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      keepaliveTime: 300000 # 5 minutes

springdoc:
  api-docs:
    path: /v3/api-docs   # Caminho para o JSON da especificação OpenAPI
  swagger-ui:
    path: /swagger-ui.html   # Caminho para a interface gráfica
    enabled: true            # Habilita o Swagger UI
    operationsSorter: method # Ordena os endpoints por metodo (GET, POST, etc.)
    tagsSorter: alpha        # Ordena os grupos de tags em ordem alfabética


  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

        logging:
          level:
            org.springframework: DEBUG
            org.hibernate.SQL: DEBUG